name: Despacho Masivo Programa OFMC 2026

on:
  workflow_dispatch:

jobs:
  despacho:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Despacho Masivo de Correos
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python scripts/despacho_programa_actions.py

      - name: Guardar registro de envíos si hubo cambios
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add scripts/historial_envios_cloud.txt || true
          if git diff --cached --quiet; then
            echo "Sin cambios en historial."
          else
            git commit -m "chore: actualizar historial de envios cloud OFMC 2026"
            git push
          fi
