name: Sync Instagram News

on:
  schedule:
    - cron: '0 0 * * *' # Once a day
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Sync Instagram Posts
        env:
          IG_HANDLE: 'lofi_sat'
        run: |
          python scripts/scrape_insta.py
          python scripts/download_news_images.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/instagram_news.json data/field_posts.json images/news/
          git commit -m "chore: auto-sync instagram news and images" || echo "No changes to commit"
          git push
