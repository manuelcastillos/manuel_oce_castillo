name: Sync Instagram News (12h)

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        npm install axios

    - name: Run Scraper via Apify
      env:
        APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      run: node scripts/update_news.js

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/instagram_news.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update instagram news data [12h sync]" && git push)
