name: Sync Outlook Calendar

on:
  schedule:
    - cron: '0 10-21 * * *'   # Every hour between 7:00 and 18:00 (UTC-3)
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install icalendar recurring_ical_events

      - name: Fetch Outlook calendar events
        run: python scripts/fetch_calendar.py

      - name: Commit and push if changed
        run: |
          git config --global user.name  'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/calendar_events.json
          git diff --cached --quiet || git commit -m "chore: auto-sync outlook calendar events"
          git push
